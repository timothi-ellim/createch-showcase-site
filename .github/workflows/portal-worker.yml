name: CreaTech approved portal job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Durable database job UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: createch-portal-target
  cancel-in-progress: false
jobs:
  run:
    if: vars.CREATECH_PORTAL_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: createch-portal
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Execute the fixed job
        run: node editorial/portal-worker.ts "$CREATECH_JOB_ID"
        env:
          CREATECH_JOB_ID: ${{ inputs.job_id }}
          REVIEWED_SOURCE_COMMIT: ${{ github.sha }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_WORKER_KEY }}
          PORTAL_ENVIRONMENT: ${{ vars.PORTAL_ENVIRONMENT }}
          PORTAL_APP_ORIGIN: ${{ vars.PORTAL_APP_ORIGIN }}
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_PORTAL_ENVIRONMENT: ${{ vars.PORTAL_ENVIRONMENT }}
          CREATECH_HOSTING_ENABLED: ${{ vars.CREATECH_HOSTING_ENABLED }}
          CREATECH_CANDIDATE_PROTECTION_VERIFIED: ${{ vars.CREATECH_CANDIDATE_PROTECTION_VERIFIED }}
          CREATECH_PAGES_PROJECT: ${{ vars.CREATECH_PAGES_PROJECT }}
          CREATECH_CANONICAL_ORIGIN: ${{ vars.CREATECH_CANONICAL_ORIGIN }}
          CREATECH_PRODUCTION_BRANCH: ${{ vars.CREATECH_PRODUCTION_BRANCH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
